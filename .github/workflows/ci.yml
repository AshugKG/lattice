name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify native macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Validate dependency-free Bun project
        run: bun install --frozen-lockfile

      - name: Check native reader
        run: bun run check

      - name: Build app bundle
        run: bun run native:bundle
