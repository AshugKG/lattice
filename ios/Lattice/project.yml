name: Lattice
options:
  bundleIdPrefix: com.ashugkg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  LatticeCorePackage:
    path: ../../macos/Lattice
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Lattice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Lattice
    resources:
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashugkg.lattice
        PRODUCT_NAME: Lattice
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lattice
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
    dependencies:
      - package: LatticeCorePackage
        product: LatticeCore
    scheme:
      testTargets: []
